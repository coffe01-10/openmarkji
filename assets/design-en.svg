<rect class="sheet" x="166" y="86" width="82" height="54" rx="8" fill="#FFFFFF" stroke="#E1E7F2" filter="url(#lift2)"/>
<rect class="hl" x="174" y="94" width="36" height="14" rx="7" fill="#FEEFC3"/>
<text class="hlT" x="192" y="104.4" text-anchor="middle" font-size="8.5" font-weight="700" fill="#A05A00">Cloze</text>
<rect class="skel" x="174" y="116" width="14" height="5" rx="2.5" fill="#E3E6EB"/>
<rect class="yel" x="191" y="114" width="26" height="9" rx="2" fill="#FBBC04"/>
<rect class="skel" x="220" y="116" width="20" height="5" rx="2.5" fill="#E3E6EB"/>
<rect class="skel" x="174" y="126" width="46" height="5" rx="2.5" fill="#E3E6EB"/>
</g>
<rect class="chip" x="20" y="192" width="36" height="22" rx="11" fill="#E8F0FE"/>
<text class="chipT" x="38" y="207.4" text-anchor="middle" font-size="12" font-weight="700" fill="#1967D2">01</text>
<text class="ink" x="66" y="211" font-size="22" font-weight="700" fill="#202124">Import</text>
<text class="ink2" font-size="14.5" fill="#3C4043"><tspan x="20" y="243">Write cards and organize knowledge</tspan><tspan x="20" y="265">Q&amp;A, cloze, formulas, answer lines</tspan></text>
</g>

<!-- 02 Study -->
<g transform="translate(376 144)">
<path class="card" d="M33.6,0H254.4C280,0 288,8 288,33.6V256.4C288,282 280,290 254.4,290H33.6C8,290 0,282 0,256.4V33.6C0,8 8,0 33.6,0Z" fill="#FFFFFF" stroke="#E8EAED" filter="url(#lift)"/>
<rect class="panel" x="14" y="14" width="260" height="160" rx="12" fill="#EEF2FB"/>
<g transform="translate(14 14)">
<rect class="back" x="42" y="20" width="176" height="128" rx="11" fill="#DCE5F7"/>
<rect class="sheet" x="30" y="12" width="200" height="128" rx="12" fill="#FFFFFF" stroke="#E1E7F2" filter="url(#lift2)"/>
<rect class="skel" x="44" y="22" width="172" height="4" rx="2" fill="#E3E6EB"/>
<rect class="blue" x="44" y="22" width="68" height="4" rx="2" fill="#4285F4"/>
<text class="ink" x="44" y="47" font-size="12.5" font-weight="700" fill="#202124">Integral of f from a to b?</text>
<line class="rule" x1="44" y1="57.5" x2="216" y2="57.5" stroke="#E8EAED" stroke-dasharray="3 3"/>
<text class="blue" x="44" y="76" font-size="13" font-weight="600" fill="#1A73E8">F(b) − F(a)</text>
<text class="sub" x="130" y="96" text-anchor="middle" font-size="9.5" fill="#5F6368">How well did you remember?</text>
<rect class="kB" x="44" y="104" width="53" height="24" rx="12" fill="#E1F0EC"/>
<rect class="vB" x="103.5" y="104" width="53" height="24" rx="12" fill="#FBEBD3"/>
<rect class="fB" x="163" y="104" width="53" height="24" rx="12" fill="#FCE6DF"/>
<g font-size="11" font-weight="700" text-anchor="middle">
<text class="kT" x="70.5" y="120" fill="#2F6F62">Know</text>
<text class="vT" x="130" y="120" fill="#9A5B00">Vague</text>
<text class="fT" x="189.5" y="120" fill="#B3401F">Forgot</text>
</g>
</g>
<rect class="chip" x="20" y="192" width="36" height="22" rx="11" fill="#E8F0FE"/>
<text class="chipT" x="38" y="207.4" text-anchor="middle" font-size="12" font-weight="700" fill="#1967D2">02</text>
<text class="ink" x="66" y="211" font-size="22" font-weight="700" fill="#202124">Study</text>
<text class="ink2" font-size="14.5" fill="#3C4043"><tspan x="20" y="243">Add the cards you pick to the plan</tspan><tspan x="20" y="265">Recall, reveal, then rate honestly</tspan></text>
</g>

<!-- 03 Review -->
<g transform="translate(712 144)">
<path class="card" d="M33.6,0H254.4C280,0 288,8 288,33.6V256.4C288,282 280,290 254.4,290H33.6C8,290 0,282 0,256.4V33.6C0,8 8,0 33.6,0Z" fill="#FFFFFF" stroke="#E8EAED" filter="url(#lift)"/>
