<g class="faint" font-size="9" text-anchor="middle" fill="#80868B">
<text x="36" y="137">1d</text>
<text x="58" y="137">3d</text>
<text x="96" y="137">7d</text>
<text x="160" y="137">16d</text>
</g>
</g>
<rect class="chip" x="20" y="192" width="36" height="22" rx="11" fill="#E8F0FE"/>
<text class="chipT" x="38" y="207.4" text-anchor="middle" font-size="12" font-weight="700" fill="#1967D2">03</text>
<text class="ink" x="66" y="211" font-size="22" font-weight="700" fill="#202124">Review</text>
<text class="ink2" font-size="14.5" fill="#3C4043"><tspan x="20" y="243">MMX schedules for 85% retention</tspan><tspan x="20" y="265">Stronger memory, longer intervals</tspan></text>
</g>
</svg>
