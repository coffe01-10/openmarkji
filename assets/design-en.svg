<rect class="sheet" x="12" y="14" width="128" height="132" rx="9" fill="#FFFFFF" stroke="#E1E7F2" filter="url(#lift2)"/>
<text class="sub" x="22" y="31" font-size="9.5" fill="#5F6368">Card syntax</text>
<line class="rule" x1="12" y1="38.5" x2="140" y2="38.5" stroke="#E8EAED"/>
<rect class="band" x="12.5" y="104.5" width="127" height="15" fill="#FEF7E0"/>
<rect class="yel" x="12.5" y="104.5" width="2.5" height="15" fill="#FBBC04"/>
<g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5">
<g class="faint" font-size="9" text-anchor="end" fill="#80868B">
<text x="27" y="55">1</text><text x="27" y="70">2</text><text x="27" y="85">3</text>
<text x="27" y="100">4</text><text x="27" y="115">5</text><text x="27" y="130">6</text>
</g>
<text x="33" y="55"><tspan class="blue" fill="#1A73E8">[P#H1#</tspan><tspan class="ink" fill="#202124">Calculus</tspan><tspan class="blue" fill="#1A73E8">]</tspan></text>
<text class="ink" x="33" y="70" fill="#202124">Integral of f?</text>
<text class="faint" x="33" y="85" fill="#80868B">---</text>
<text x="33" y="100"><tspan class="blue" fill="#1A73E8">[E##</tspan><tspan class="ink" fill="#202124">F(b)-F(a)</tspan><tspan class="blue" fill="#1A73E8">]</tspan></text>
<text class="hlT" x="33" y="115" font-weight="700" fill="#A05A00">===CARD===</text>
<text x="33" y="130"><tspan class="ink" fill="#202124">Spaced </tspan><tspan class="blue" fill="#1A73E8">[F#1#</tspan><tspan class="ink" fill="#202124">reps</tspan><tspan class="blue" fill="#1A73E8">]</tspan></text>
</g>
<path class="blueS" d="M146,80H157M153,76L157,80L153,84" fill="none" stroke="#4285F4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="sheet" x="166" y="22" width="82" height="54" rx="8" fill="#FFFFFF" stroke="#E1E7F2" filter="url(#lift2)"/>
<rect class="chip" x="174" y="30" width="30" height="14" rx="7" fill="#E8F0FE"/>
