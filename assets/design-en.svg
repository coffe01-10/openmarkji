<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="516" viewBox="0 0 1040 516" role="img" aria-label="How OpenMarkji works: import, study, review" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif">
<title>How OpenMarkji works</title>
<desc>Import → Study → Review: write cards in text and split them using a separator line; recall before revealing, then rate Know, Vague or Forgot; MMX schedules for 85% target retention, and due cards return to Today each day.</desc>
<!-- 浅色取值写在属性里，深色取值只在媒体查询中覆盖。 -->
<style>
@media (prefers-color-scheme: dark) {
  .canvas{fill:#16181B}.frame{stroke:#2D3136}.dot{fill:#2B2F35}
  .gb0{stop-color:#8AB4F8;stop-opacity:.12}.gb1,.ga1{stop-color:#8AB4F8}.ga0{stop-color:#8AB4F8;stop-opacity:.26}
  .gy0{stop-color:#FDD663;stop-opacity:.06}.gy1{stop-color:#FDD663}
  .fs{flood-color:#000;flood-opacity:.3}
  .card{fill:#1F2125;stroke:#33373D}.panel{fill:#1B2130}.back{fill:#2A3448}
  .sheet{fill:#272B32;stroke:#363B44}.sheetF{fill:#272B32}.ring{stroke:#272B32}
  .node{fill:#1F2125;stroke:#3A3F46}.conn{stroke:#4A5260}.rule{stroke:#363B44}.dash{stroke:#5F6368}
  .ink{fill:#E8EAED}.ink2{fill:#BDC1C6}.sub{fill:#9AA0A6}.faint{fill:#8E949A}
  .blue{fill:#8AB4F8}.blueS{stroke:#8AB4F8}.chip{fill:#1F3354}.chipT{fill:#A8C7FA}.skel{fill:#3A3F47}
  .band{fill:#38341F}.hl{fill:#4A3D12}.hlT,.yel{fill:#FDD663}.yelS{stroke:#FDD663}
  .kB{fill:#1D3832}.kT{fill:#92D4C2}.vB{fill:#3D2E12}.vT{fill:#FFC164}.fB{fill:#42221A}.fT{fill:#FF976E}
}
</style>
<defs>
<clipPath id="frame"><path d="M39.7,0.5H1000.3C1030.17,0.5 1039.5,9.83 1039.5,39.7V476.3C1039.5,506.17 1030.17,515.5 1000.3,515.5H39.7C9.83,515.5 0.5,506.17 0.5,476.3V39.7C0.5,9.83 9.83,0.5 39.7,0.5Z"/></clipPath>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="dot" cx="10" cy="10" r="1" fill="#DADCE0"/></pattern>
<radialGradient id="glowB" gradientUnits="userSpaceOnUse" cx="940" cy="24" r="400"><stop class="gb0" offset="0" stop-color="#4285F4" stop-opacity=".14"/><stop class="gb1" offset="1" stop-color="#4285F4" stop-opacity="0"/></radialGradient>
<radialGradient id="glowY" gradientUnits="userSpaceOnUse" cx="60" cy="516" r="340"><stop class="gy0" offset="0" stop-color="#FBBC04" stop-opacity=".12"/><stop class="gy1" offset="1" stop-color="#FBBC04" stop-opacity="0"/></radialGradient>
<linearGradient id="area" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="122"><stop class="ga0" offset="0" stop-color="#4285F4" stop-opacity=".24"/><stop class="ga1" offset="1" stop-color="#4285F4" stop-opacity="0"/></linearGradient>
<filter id="lift" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow class="fs" dx="0" dy="1" stdDeviation="1" flood-color="#3C4043" flood-opacity=".08"/><feDropShadow class="fs" dx="0" dy="8" stdDeviation="12" flood-color="#3C4043" flood-opacity=".07"/></filter>
<filter id="lift2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow class="fs" dx="0" dy="2" stdDeviation="3" flood-color="#3C4043" flood-opacity=".1"/></filter>
</defs>

<!-- 画布 -->
<path class="canvas" d="M39.7,0.5H1000.3C1030.17,0.5 1039.5,9.83 1039.5,39.7V476.3C1039.5,506.17 1030.17,515.5 1000.3,515.5H39.7C9.83,515.5 0.5,506.17 0.5,476.3V39.7C0.5,9.83 9.83,0.5 39.7,0.5Z" fill="#F8F9FA"/>
<g clip-path="url(#frame)">
<rect width="1040" height="516" fill="url(#glowB)"/>
<rect width="1040" height="516" fill="url(#glowY)"/>
<rect width="1040" height="516" fill="url(#dots)"/>
</g>
<path class="frame" d="M39.7,0.5H1000.3C1030.17,0.5 1039.5,9.83 1039.5,39.7V476.3C1039.5,506.17 1030.17,515.5 1000.3,515.5H39.7C9.83,515.5 0.5,506.17 0.5,476.3V39.7C0.5,9.83 9.83,0.5 39.7,0.5Z" fill="none" stroke="#E8EAED"/>

<!-- 标题 -->
<rect class="yel" x="40" y="42" width="12" height="6" fill="#FBBC04"/>
<text class="blue" x="60" y="49.4" font-size="12" font-weight="700" letter-spacing="2.4" fill="#1A73E8">HOW IT WORKS</text>
<text class="ink" x="40" y="90" font-size="30" font-weight="700" fill="#202124">Focus on recall. The algorithm does the rest.</text>
<text class="sub" x="40" y="117" font-size="15" fill="#5F6368">Import → Study → Review, with cards and progress kept on your device</text>

<!-- 步骤之间的箭头与每日循环 -->
<g class="node" fill="#FFFFFF" stroke="#E1E5EA" filter="url(#lift2)">
<circle cx="352" cy="238" r="16"/>
<circle cx="688" cy="238" r="16"/>
</g>
<path class="blueS" d="M349,232L355,238L349,244M685,232L691,238L685,244" fill="none" stroke="#4285F4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path class="conn" d="M856,438V452Q856,464 844,464H532Q520,464 520,452V445" fill="none" stroke="#B4BDCB" stroke-width="1.6" stroke-dasharray="3 5" stroke-linecap="round"/>
<path class="conn" d="M515,445.5L520,440L525,445.5" fill="none" stroke="#B4BDCB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="node" x="558" y="451" width="264" height="26" rx="13" fill="#FFFFFF" stroke="#E1E5EA"/>
<path class="blueS" d="M580,459A5,5 0 1 1 575,464M572.6,465.2L575,462.6L577.4,465.2" fill="none" stroke="#4285F4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="sub" x="594" y="468.5" font-size="12.5" fill="#5F6368">Daily loop · due reviews and new cards</text>

<!-- 01 Import -->
<g transform="translate(40 144)">
<path class="card" d="M33.6,0H254.4C280,0 288,8 288,33.6V256.4C288,282 280,290 254.4,290H33.6C8,290 0,282 0,256.4V33.6C0,8 8,0 33.6,0Z" fill="#FFFFFF" stroke="#E8EAED" filter="url(#lift)"/>
